# Ajustes de memoria estándar (reducidos para evitar OOM)
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8

# Ajustamos la memoria para el proceso de Kotlin
kotlin.daemon.jvm.options=-Xmx768m

# Configuraciones de compatibilidad
android.useAndroidX=true

# DESACTIVAMOS Jetifier: esto es clave porque tu error ocurre aquí.
# La mayoría de los plugins modernos de Flutter ya no lo necesitan.
android.enableJetifier=false

# Optimizaciones de construcción
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=true
kotlin.incremental=false

# Desabilitar paralelismo en Gradle para evitar problemas de memoria
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=false